---
- name: Get Pixelfed user information
  ansible.builtin.getent:
    database: passwd
    key: pixelfed

- name: Set Pixelfed UID
  ansible.builtin.set_fact:
    pixelfed_uid: "{{ ansible_facts.getent_passwd.pixelfed[1] }}"

- name: Stop existing Pixelfed services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    scope: user
  become: true
  become_user: pixelfed
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ pixelfed_uid }}
  loop:
    - pixelfed-app.service
    - pixelfed-redis.service
    - pixelfed-db.service
  failed_when: false

- name: Remove existing Pixelfed containers
  containers.podman.podman_container:
    name: "{{ item }}"
    state: absent
  become: true
  become_user: pixelfed
  loop:
    - pixelfed-app
    - pixelfed-redis
    - pixelfed-db

- name: Create Pixelfed application directory
  ansible.builtin.file:
    path: "{{ pixelfed_root }}"
    state: directory
    owner: pixelfed
    group: pixelfed
    mode: "0755"

- name: Create Pixelfed persistent directories
  ansible.builtin.file:
    path: "{{ pixelfed_root }}/{{ item }}"
    state: directory
    owner: pixelfed
    group: pixelfed
    mode: "0755"
  loop:
    - storage
    - storage/app/public
    - storage/framework/cache
    - storage/framework/sessions
    - storage/framework/views
    - storage/logs
    - bootstrap-cache
    - mysql
    - redis

- name: Create Pixelfed source directory
  ansible.builtin.file:
    path: "{{ pixelfed_app_dir }}"
    state: directory
    owner: pixelfed
    group: pixelfed
    mode: "0755"

- name: Check out Pixelfed
  ansible.builtin.git:
    repo: https://github.com/pixelfed/pixelfed.git
    dest: "{{ pixelfed_app_dir }}"
    version: "{{ pixelfed_version }}"
    force: true
    update: true
  become_user: pixelfed

- name: Create rootless Quadlet directory
  ansible.builtin.file:
    path: /home/pixelfed/.config/containers/systemd
    state: directory
    owner: pixelfed
    group: pixelfed
    mode: "0700"

- name: Create MySQL environment file
  ansible.builtin.template:
    src: db.env.j2
    dest: "{{ pixelfed_root }}/db.env"
    owner: pixelfed
    group: pixelfed
    mode: "0600"

- name: Create MySQL Quadlet
  ansible.builtin.template:
    src: pixelfed-db.container.j2
    dest: /home/pixelfed/.config/containers/systemd/pixelfed-db.container
    owner: pixelfed
    group: pixelfed
    mode: "0600"

- name: Create Redis Quadlet
  ansible.builtin.template:
    src: pixelfed-redis.container.j2
    dest: /home/pixelfed/.config/containers/systemd/pixelfed-redis.container
    owner: pixelfed
    group: pixelfed
    mode: "0600"

- name: Create Pixelfed environment file
  ansible.builtin.template:
    src: pixelfed.env.j2
    dest: "{{ pixelfed_app_dir }}/.env"
    owner: pixelfed
    group: pixelfed
    mode: "0600"

- name: Configure Podman registry search
  become_user: pixelfed
  ansible.builtin.file:
    path: /home/pixelfed/.config/containers
    state: directory
    owner: pixelfed
    group: pixelfed
    mode: "0700"

- name: Configure Docker Hub as Podman short-name registry
  become_user: pixelfed
  ansible.builtin.template:
    src: registries.conf.j2
    dest: /home/pixelfed/.config/containers/registries.conf
    owner: pixelfed
    group: pixelfed
    mode: "0600"

- name: Build Pixelfed application image
  become_user: pixelfed
  ansible.builtin.command:
    cmd: "podman build -t localhost/pixelfed:{{ pixelfed_version | regex_replace('^v', '') }} ."
    chdir: "{{ pixelfed_app_dir }}"

- name: Create Pixelfed application Quadlet
  ansible.builtin.template:
    src: pixelfed-app.container.j2
    dest: /home/pixelfed/.config/containers/systemd/pixelfed-app.container
    owner: pixelfed
    group: pixelfed
    mode: "0600"

- name: Reload Pixelfed user systemd
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: true
  become_user: pixelfed
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pixelfed_uid }}"

- name: Enable and start Pixelfed services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
    scope: user
  become: true
  become_user: pixelfed
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pixelfed_uid }}"
  loop:
    - pixelfed-db.service
    - pixelfed-redis.service
    - pixelfed-app.service
